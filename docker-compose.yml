name: aic2026

services:
  qdrant:
    # Keep this pinned. Collection snapshots are only portable within a
    # compatible Qdrant minor version; upgrade image and restore procedure
    # together, never by silently following `latest`.
    image: qdrant/qdrant:v1.12.1
    container_name: aic2026-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_BIND_ADDRESS:-127.0.0.1}:${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_BIND_ADDRESS:-127.0.0.1}:${QDRANT_GRPC_PORT:-6334}:6334"
    environment:
      QDRANT__SERVICE__API_KEY: "${QDRANT_API_KEY:?Set QDRANT_API_KEY in .env}"
    volumes:
      - ./data/qdrant/storage:/qdrant/storage
      - ./data/qdrant/snapshots:/qdrant/snapshots
